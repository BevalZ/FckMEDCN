    <title>白大衣模拟器 — 临床医学人生模拟</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      body { display: flex; justify-content: center; align-items: center; }

      #game-container {
        width: 100%; height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game-container:focus-visible, #game-container canvas:focus-visible {
        outline: 2px solid #4fc3f7;
        outline-offset: -2px;
      }
      #game-container canvas { display: block; margin: auto; }
      .visually-hidden {
        position: fixed;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* 竖屏提示：仅触屏竖屏时显示，且不拦截点击 */
      #rotate-hint {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 10px;
        text-align: center;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', 'STHeiti', 'SimHei', '黑体', 'WenQuanYi Micro Hei', sans-serif;
        font-size: 13px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.72);
        z-index: 10;
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: block; }
      }

      /* —— HTML 标题层（保证中文抗锯齿完整渲染） —— */
      /* JS 会同步该 div 的位置/尺寸到 canvas 的真实屏幕矩形 */
      #title-overlay {
        position: fixed;
        left: 0; top: 0;
        width: 960px; height: 540px;
        transform-origin: 0 0;
        pointer-events: none;
        z-index: 5;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', 'STHeiti', 'SimHei', '黑体', 'WenQuanYi Micro Hei', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-weight: normal;
        display: none;
      }
      #title-overlay.show { display: block; }
      /* 坐标与 TitleScene 旧 Phaser 文本一一对应（canvas 内部坐标系） */
      #title-main {
        position: absolute;
        left: 480px; top: 140px;
        transform: translateX(-50%);
        font-size: 52px;
        font-weight: bold;
        color: #cc2222;
        margin: 0;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
        letter-spacing: 0.04em;
        opacity: 0;
      }
      #title-sub {
        position: absolute;
        left: 480px; top: 206px;
        transform: translateX(-50%);
        font-size: 18px;
        color: #888;
        margin: 0;
        white-space: nowrap;
        opacity: 0;
      }
      #title-disclaimer {
        position: absolute;
        left: 100px; top: 248px;
        width: 760px;
        font-size: 12px;
        line-height: 1.6;
        color: #737380;
        text-align: center;
        opacity: 0;
      }
      .title-btn {
        position: absolute;
        left: 480px;
        transform: translateX(-50%);
        background: transparent;
        border: none;
        color: #fff;
        font-family: inherit;
        cursor: pointer;
        padding: 4px 16px;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
        opacity: 0;
      }
      #title-start { top: 404px; font-size: 20px; font-weight: bold; }
      #title-continue { top: 448px; font-size: 18px; color: #ffc107; font-weight: bold; display: none; }
      #title-continue.show { display: block; }
      #title-gallery { top: 512px; font-size: 16px; color: #4fc3f7; }
      #title-gender-hint {
        position: absolute;
        left: 480px; top: 534px;
        transform: translateX(-50%);
        font-size: 11px;
        color: #556;
        margin: 0;
        white-space: nowrap;
        opacity: 0;
      }
      #title-gender-edit { top: 474px; font-size: 14px; color: #ffc107; display: none; }
      #title-gender-edit.show { display: block; }
      #gender-edit-panel { top: 474px; font-size: 14px; color: #ffc107; display: none; }
      #gender-edit-panel.show { display: block; }
      .gender-pick {
        background: transparent;
        border: 1px solid #4fc3f7;
        color: #4fc3f7;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        padding: 2px 14px;
        margin-left: 6px;
        pointer-events: auto;
      }
      #gender-edit-label { color: #cccccc; }
    </style>
  </head>
  <body>
    <div id="rotate-hint">竖屏体验不佳，建议横屏游玩 🔄</div>
    <div id="game-container" role="region" aria-label="白大衣模拟器游戏画布" aria-describedby="game-a11y-status" tabindex="0"></div>
    <div id="game-a11y-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="title-overlay">
      <h1 id="title-main">白大衣模拟器</h1>
      <div id="title-sub">— 临床医学专业人生模拟器 —</div>
      <div id="title-disclaimer">叙事模拟：游戏内快讯、机构与数值为匿名综合改写或趋势推演，不构成现实事实、医学建议或诊疗依据。</div>
      <button id="title-start" class="title-btn">[ 开始游戏 ]</button>
      <button id="title-continue" class="title-btn">[ 继续游戏 ]</button>
      <button id="title-gender-edit" class="title-btn">[ 修改性别 ]</button>
      <div id="gender-edit-panel" class="title-btn">
        <span id="gender-edit-label">性别：</span>
        <button id="gender-pick-male" class="gender-pick">男生</button>
        <button id="gender-pick-female" class="gender-pick">女生</button>
        <button id="gender-edit-cancel" class="gender-pick">取消</button>
      </div>
      <button id="title-gallery" class="title-btn">[ 人生图鉴 (G) ]</button>
      <div id="title-gender-hint">新开一局时可选择性别，学长/学姐、儿子/女儿等称谓会随之变化</div>
    </div>
    <script>
      // 同步 title-overlay 的位置/尺寸到 Phaser canvas 的真实屏幕矩形
      (function () {
        var observedCanvas = null;
        var resizeObserver = typeof ResizeObserver === 'function'
          ? new ResizeObserver(function () { sync(); })
          : null;
        function sync() {
          var canvas = document.querySelector('#game-container > canvas');
          var overlay = document.getElementById('title-overlay');
          if (!canvas || !overlay) return;
          if (canvas !== observedCanvas) {
            if (resizeObserver && observedCanvas) resizeObserver.unobserve(observedCanvas);
            observedCanvas = canvas;
            if (resizeObserver) resizeObserver.observe(canvas);
          }
          var r = canvas.getBoundingClientRect();
          overlay.style.left = r.left + 'px';
          overlay.style.top = r.top + 'px';
          overlay.style.width = '960px';
          overlay.style.height = '540px';
          overlay.style.transform = 'scale(' + (r.width / 960) + ',' + (r.height / 540) + ')';
        }
        window.addEventListener('resize', sync);
        window.addEventListener('orientationchange', sync);
        window.addEventListener('pageshow', sync);
        var container = document.getElementById('game-container');
        if (container && typeof MutationObserver === 'function') {
          new MutationObserver(sync).observe(container, { childList: true });
        }
        sync();
        // Phaser 初始化后 canvas 位置可能再微调
        setTimeout(sync, 60);
        setTimeout(sync, 250);
        setTimeout(sync, 600);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
