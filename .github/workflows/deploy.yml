name: Release to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (preview defers medical/evidence/acceptance human gates)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: track
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ inputs.track }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview([.-][0-9A-Za-z.-]+)?$ ]]; then
            TRACK=preview
          else
            TRACK=full
          fi
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "Resolved release track: ${TRACK} (ref=${GITHUB_REF_NAME})"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:schema
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
        env:
          VITE_RELEASE_TRACK: ${{ steps.track.outputs.track }}
      - run: npm run test:preview:subpath
      - run: npm run audit:prod
      - run: npm run test:ci
      - run: npm run release:check -- --track=${{ steps.track.outputs.track }}
        env:
          RELEASE_TRACK: ${{ steps.track.outputs.track }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
