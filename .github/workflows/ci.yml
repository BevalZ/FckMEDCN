name: CI and Preview Artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:schema
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm run test:preview:subpath
      - run: npm run audit:prod
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist-${{ github.sha }}
          path: dist
          retention-days: 7
